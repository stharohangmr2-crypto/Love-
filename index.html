<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imposter</title>
<meta name="theme-color" content="#14121b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Imposter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#f4f1ea;--sf:#fff;--tx:#1d1b22;--mu:#6b6776;--ac:#6d4aff;--ac2:#ff4a6e;--ch:#b7791f;--bd:#ddd8e8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121b;--sf:#201c2c;--tx:#f1eefa;--mu:#9b95ad;--ch:#f6c453;--bd:#34304a}}
:root[data-theme="dark"]{--bg:#14121b;--sf:#201c2c;--tx:#f1eefa;--mu:#9b95ad;--ch:#f6c453;--bd:#34304a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:20px 18px 32px}
h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.5px}
h1 span{color:var(--ac2)}
p.sub{color:var(--mu);margin:0 0 18px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:18px;padding:18px}
label.t{font-size:13px;color:var(--mu);display:block;margin:0 0 8px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.modes button{text-align:left;padding:11px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.modes b{display:block;font-size:15px}
.modes span{font-size:12px;color:var(--mu);line-height:1.3;display:block;margin-top:2px}
.modes button.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.count{display:flex;gap:8px;margin-bottom:18px}
.count button{flex:1;padding:12px 0;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:17px;font-weight:600}
.count button.on{background:var(--ac);border-color:var(--ac);color:#fff}
input[type=text]{width:100%;padding:13px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.cheats{margin-top:6px;padding:12px 14px;border:1px dashed var(--ch);border-radius:14px}
.cheats b{color:var(--ch);font-size:14px}
.cheats label{display:flex;gap:10px;align-items:center;font-size:14px;margin-top:9px}
.cheats input{width:18px;height:18px}
.err{color:var(--ac2);font-size:14px;margin-top:10px;min-height:0}
.btn{width:100%;padding:15px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;margin-top:10px}
.btn.alt{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.hide{display:none!important}
.turn{text-align:center;color:var(--mu);margin:6px 0 14px}
.turn b{display:block;color:var(--tx);font-size:26px;margin-top:4px}
.scene{perspective:900px;margin:10px 0 16px}
.card{position:relative;height:350px;transform-style:preserve-3d;transition:transform .5s;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}
.front{background:linear-gradient(145deg,var(--ac),#9a5cff);color:#fff;font-size:20px;font-weight:700}
.front small{display:block;font-weight:400;opacity:.85;margin-top:10px;font-size:14px}
.front .q{font-size:72px;line-height:1;margin-bottom:10px}
.back{transform:rotateY(180deg);background:var(--sf);border:2px solid var(--bd)}
.back.imp{border-color:var(--ac2)}
.role{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mu);margin-bottom:10px}
.word{font-size:40px;font-weight:800;word-break:break-word}
.word.sm{font-size:24px;line-height:1.25}
.imp .word{color:var(--ac2)}
.hint{margin-top:14px;font-size:16px;color:var(--mu)}
.hint b{color:var(--tx)}
.cl{margin-top:16px;font-size:12.5px;color:var(--ch);white-space:pre-line;border-top:1px dashed var(--ch);padding-top:10px}
.dots{display:flex;justify-content:center;gap:7px;margin-top:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.dots i.d{background:var(--ac)}
.result{text-align:center}
.result .word{margin:8px 0}
.cm{margin-top:10px;display:flex;gap:8px;align-items:center;justify-content:center}
.cm button{padding:7px 12px;border-radius:10px;border:1px dashed var(--ch);background:transparent;color:var(--ch);font-size:12.5px}
.cm span{font-size:12px;color:var(--mu)}
.rr{display:block;width:100%;text-align:left;padding:11px 12px;margin-top:8px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.rr span{display:block;font-size:12px;color:var(--mu)}
.rr.on{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.pl{padding:6px 0;border-bottom:1px solid var(--bd)}
.pl.out{opacity:.45;text-decoration:line-through}
select{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:15px;margin-top:6px}
.oc{background:var(--sf);border:2px solid var(--bd);border-radius:22px;padding:22px;text-align:center;min-height:190px;display:flex;flex-direction:column;justify-content:center;margin:10px 0 4px;cursor:pointer}
.oc.imp{border-color:var(--ac2)}
.oc.imp .word{color:var(--ac2)}
#msgs{max-height:220px;overflow-y:auto;margin-bottom:10px}
.m{font-size:14px;margin:5px 0;word-break:break-word}
.m b{color:var(--ac)}
.crow{display:flex;gap:8px}
.crow input{margin:0}
.crow .btn{width:auto;margin:0;padding:0 18px}
.rc{text-align:center;padding:2px 0 14px;border-bottom:1px solid var(--bd);margin-bottom:12px}
.rc .lb{font-size:13px;color:var(--mu)}
button.code{display:block;margin:6px auto 4px;background:none;border:0;color:var(--tx);font:800 44px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:10px;padding:4px 0 4px 10px}
.rc .lb2{font-size:12.5px;color:var(--mu)}
.pc{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.pc b{font-size:17px}
.pc span{font-size:13px;color:var(--mu)}
.pl .you{color:var(--mu);font-size:12px;margin-left:6px}
.tip{margin:12px 0;padding:12px 14px;border:1px dashed var(--ch);border-radius:14px;text-align:center}
.tip .tr{font-size:13px;color:var(--ch);font-weight:700}
.tip .tw{font-size:32px;font-weight:800;margin:6px 0 2px;word-break:break-word}
.tip small{display:block;font-size:12.5px;color:var(--mu);line-height:1.4;margin-top:4px}

:root{--ok:#2fbf8a}
.rh{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.rh span{font-size:12.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.rh span:first-child{color:var(--tx);font-weight:700;letter-spacing:1.5px;font-family:ui-monospace,Menlo,Consolas,monospace}
.pl{display:flex;align-items:center;gap:10px;padding:7px 0}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.win{border-radius:16px;padding:16px;margin-bottom:10px;border:1px solid var(--bd);background:var(--bg)}
.win.crew{border-color:var(--ok);background:rgba(47,191,138,.12)}
.win.imp{border-color:var(--ac2);background:rgba(255,74,110,.12)}
.win h2{margin:0;font-size:26px;letter-spacing:-.4px}
.win p{margin:4px 0 0;color:var(--mu);font-size:14px}
.lv{font-size:13px;color:var(--mu);margin:0 0 6px}
.pr{display:flex;align-items:center;gap:10px;padding:9px 12px;margin-top:6px;border-radius:12px;border:1px solid var(--bd);background:var(--bg)}
.pr.i{border-color:var(--ac2)}
.pr .nm{flex:1;font-size:16px}
.pr .nm small{display:block;font-size:12px;color:var(--mu)}
.bd{font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.bi{color:var(--ac2);border:1px solid var(--ac2)}
.bc{color:var(--mu);border:1px solid var(--bd)}
.wd{margin-top:12px;text-align:center;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--bd)}
.wd span{display:block;font-size:12.5px;color:var(--mu)}
.wd b{display:block;font-size:30px;letter-spacing:-.5px;margin-top:2px}
.wd b.s{font-size:18px;letter-spacing:0;margin-top:6px}
#msgs{display:flex;flex-direction:column;gap:7px;max-height:300px}
.b{display:flex;gap:8px;align-items:flex-end;max-width:86%}
.b.me{align-self:flex-end}
.bt{background:var(--bg);border:1px solid var(--bd);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:14.5px;word-break:break-word}
.bt i{display:block;font-style:normal;font-size:11px;color:var(--mu);margin-bottom:1px}
.b.me .bt{background:var(--ac);border-color:var(--ac);color:#fff;border-radius:14px 14px 4px 14px}
.kit{margin-top:12px;border:1px dashed var(--ch);border-radius:14px;padding:0 14px 8px}
.kh{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:var(--ch);font:inherit;font-size:14px;padding:11px 0}
.ks{border-top:1px solid var(--bd);padding:10px 0 4px}
.kl{font-size:12px;color:var(--mu);margin-bottom:4px}
.kr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:4px 0;font-size:14px}
.kr small{color:var(--mu);font-size:12px}
.kn{font-size:12.5px;color:var(--mu);margin-top:4px}
.kb{padding:7px 14px;border-radius:10px;border:0;background:var(--ch);color:#14121b;font-weight:700;font-size:13px}
.kb.wide{width:100%;padding:11px;font-size:14px}
.dim{opacity:.5}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chips button{padding:7px 14px;border-radius:99px;border:1px solid var(--ch);background:transparent;color:var(--ch);font-size:14px}
.kit select{margin-top:4px}
.nt{margin-top:12px}
.nh{display:flex;gap:8px}
.nb,.np{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:10px;padding:8px 12px;font:inherit;font-size:12.5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.nb{flex:1;text-align:left}
.nbody{border:1px dashed var(--ch);border-radius:14px;padding:2px 14px 10px;margin-top:8px}
.nbody>.ks:first-child{border-top:0}
.np.wide{width:100%;margin-top:4px}
#dc{display:block;width:100%;aspect-ratio:1/1;border-radius:14px;border:1px solid var(--bd);background:#fff;touch-action:none;margin-top:10px}
.dst{font-size:15px;font-weight:700}
.dleg{display:flex;gap:6px 12px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--mu)}
.dleg .lg{display:inline-flex;align-items:center;gap:5px}
.dleg .lg i{width:10px;height:10px;border-radius:50%;display:inline-block}
.dleg .lg.now{color:var(--tx);font-weight:700}
.drow{display:flex;gap:8px;margin-top:10px}
.drow .btn{margin-top:0;flex:1;padding:12px}
.drow .btn:disabled{opacity:.4}
.dword{margin-top:10px;padding:10px 12px;border:1px dashed var(--ch);border-radius:12px;text-align:center;font-size:15px}
.err.cerr{margin:0 0 8px}
.ur{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.up{flex:1 1 88px;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);text-align:center}
.up.now{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.up .un{font-size:13px;font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up .un small{font-weight:400;color:var(--mu)}
.up .uk{font-size:12px;color:var(--mu)}
.up .uk.u1{color:var(--ac2);font-weight:700}
.tbl{position:relative;margin:8px -4px 8px;padding:18px 8px 14px;border-radius:22px;background:radial-gradient(ellipse at 50% 35%,#238a57 0%,#16613f 55%,#0c3d27 100%);box-shadow:inset 0 0 0 5px #6b4524,inset 0 0 0 7px #8a5d33,inset 0 0 36px rgba(0,0,0,.5)}
.ut{display:flex;gap:30px;justify-content:center;align-items:flex-start;margin:0}
.uc{position:relative;width:62px;height:90px;border-radius:9px;border:3px solid #fff;color:#fff;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.4);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;flex:none;background:#999}
.uc .ov{position:absolute;left:11%;right:11%;top:13%;bottom:13%;background:#fff;border-radius:50%;transform:rotate(-26deg);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.uc .ov b{transform:rotate(26deg);font-size:28px;font-weight:900;line-height:1;color:var(--cc,#222);text-shadow:1px 1px 0 rgba(0,0,0,.45);font-family:Georgia,"Times New Roman",serif}
.uc .cn{position:absolute;font-style:normal;font-weight:800;font-size:12px;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.uc .tl{left:5px;top:4px}.uc .br{right:5px;bottom:4px;transform:rotate(180deg)}
.uc.big{width:92px;height:134px;border-radius:13px;border-width:4px}
.uc.big .cn{font-size:17px}.uc.big .tl{left:7px;top:6px}.uc.big .br{right:7px;bottom:6px}
.uc.big .ov b{font-size:46px}
.uR{background:#d8281a;--cc:#d8281a}.uG{background:#2f9a3e;--cc:#2f9a3e}.uB{background:#1457c4;--cc:#1457c4}.uY{background:#f2c500;--cc:#f2c500;color:#fff}
.uW{background:#14131a}
.uW .ov{background:conic-gradient(#d8281a 0 25%,#f2c500 0 50%,#2f9a3e 0 75%,#1457c4 0)}
.uW .ov b{color:#fff}
.uback{background:#14131a;border-color:#fff}
.uback .ov{background:#d8281a}
.uback .ov b{color:#ffd400;font-style:italic;font-size:15px;letter-spacing:-1px;text-shadow:1px 1px 0 #000}
.uc.big.uback .ov b{font-size:25px}
.dk{display:flex;flex-direction:column;align-items:center;gap:8px}
.dk .uc.big{box-shadow:0 1px 0 #555,0 2px 0 #14131a,0 3px 0 #555,0 4px 0 #14131a,0 5px 0 #555,0 12px 14px rgba(0,0,0,.5)}
.dk .uc.ok{cursor:pointer;animation:upulse 1.2s ease-in-out infinite}
.dk .uc.no{filter:brightness(.7)}
@keyframes upulse{0%,100%{box-shadow:0 1px 0 #555,0 2px 0 #14131a,0 3px 0 #555,0 4px 0 #14131a,0 5px 0 #555,0 0 0 3px #ffe27a,0 0 14px 4px rgba(255,226,122,.5)}50%{box-shadow:0 1px 0 #555,0 2px 0 #14131a,0 3px 0 #555,0 4px 0 #14131a,0 5px 0 #555,0 0 0 3px #ffe27a,0 0 22px 8px rgba(255,226,122,.8)}}
.cnt{font-size:12px;color:#d7f2e2;font-weight:700}
.pf{display:flex;flex-direction:column;align-items:center;gap:8px}
.pile{position:relative;width:92px;height:134px;border-radius:14px;transition:box-shadow .15s,transform .15s}
.pile .uc{position:absolute;left:0;top:0}
.pile.hl{box-shadow:0 0 0 3px #fff,0 0 24px 8px rgba(255,255,255,.55);transform:scale(1.05)}
.ucol{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#d7f2e2}
.ucol i{width:14px;height:14px;border-radius:50%;border:2px solid #fff;display:block}
.uh{position:relative;height:150px;margin:4px 0 0;overflow:visible}
.uh .uc{position:absolute;left:50%;top:26px;margin-left:-31px;transform:translateX(var(--x,0px)) translateY(var(--y,0px)) rotate(var(--a,0deg));transition:transform .18s ease,filter .18s ease}
.uh .uc.ok{cursor:grab;touch-action:none;transform:translateX(var(--x,0px)) translateY(calc(var(--y,0px) - 18px)) rotate(var(--a,0deg));box-shadow:0 0 0 2px #ffe27a,0 0 14px 4px rgba(255,226,122,.6)}
.uh .uc.no{filter:brightness(.62)}
.uc.ghost{position:fixed;margin:0;z-index:9999;pointer-events:none;transition:none;box-shadow:0 14px 26px rgba(0,0,0,.5),0 0 0 2px #ffe27a;will-change:transform}
.uc.tmp{position:fixed;z-index:9998;pointer-events:none;margin:0}
.mini{display:flex;justify-content:center;height:16px;margin:3px 0 1px}
.mini i{display:block;width:11px;height:16px;border-radius:2px;background:#14131a;border:1.5px solid #fff;margin-left:-6px;box-shadow:0 1px 2px rgba(0,0,0,.3);position:relative}
.mini i:first-child{margin-left:0}
.mini i:after{content:"";position:absolute;left:2px;right:2px;top:3px;bottom:3px;border-radius:50%;background:#d8281a}
.ust{text-align:center;font-size:14px;color:var(--mu);margin:0 0 4px;min-height:20px}
.utn{text-align:center;font-size:18px;font-weight:800;margin:4px 0}
.gfp{padding:14px}
.gfp .rh{align-items:center}
.gfp .snd{margin-left:auto;border:0;background:transparent;font-size:18px;line-height:1;padding:2px 4px;cursor:pointer}
.gslot{margin:10px -4px 0}
.gcv{display:block;width:100%;height:min(64vh,560px);min-height:380px;border-radius:16px;background:#123f26;box-shadow:0 6px 18px rgba(0,0,0,.28),inset 0 0 0 2px rgba(255,255,255,.08);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.gcl{display:flex;gap:6px;margin:10px -2px 0;overflow-x:auto;padding:2px}
.gcb{flex:1 1 0;min-width:0;border:2px solid var(--bd);background:var(--sf);color:var(--tx);border-radius:12px;padding:6px 4px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.gcb b{font-size:15px}.gcb small{font-size:9.5px;color:var(--mu);white-space:nowrap}
.gcb.on{border-color:var(--ac);background:var(--ac);color:#fff}.gcb.on small{color:#e6e0ff}
.gtbw{overflow-x:auto;margin-top:12px}

.gtb th{color:var(--mu);font-weight:600}.gtb th.cur{color:var(--ac)}
.gtb td.pn{text-align:left;white-space:nowrap;font-weight:600}
.gtb td.pn i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.gtb td.pn small{font-weight:400;color:var(--mu)}
.gtb tr.par td{color:var(--mu);font-size:12px}
.gtb tr.turn td{background:rgba(109,74,255,.09)}
.gtb td.live{color:var(--ac2);font-weight:700}

.upick button{flex:1;height:46px;border-radius:12px;border:2px solid #fff;color:#fff;font:inherit;font-weight:700;font-size:14px}

<body>
<main>
<h1>Imposter<span>.</span></h1>
<p class="sub">Pass the phone. Somebody is faking it.</p>

<section id="setup" class="panel">
  <label class="t">Game mode</label>
  <div class="modes" id="modes"></div>
  <label class="t">Number of players</label>
  <div class="count" id="count"></div>
  <label class="t">Player names</label>
  <div id="names"></div>
  <div class="err" id="err"></div>
  <button class="btn" id="start">Start game</button>
  <button class="btn alt" id="goOnline">Play online (multiplayer)</button>
  <button class="btn alt hide" id="install">Install app</button>
  <p class="sub hide" id="iosnote" style="margin:12px 0 0;font-size:13px">To install on iPhone: tap Share, then Add to Home Screen.</p>
</section>

<section id="play" class="hide">
  <div class="turn">Pass the phone to<b id="pname"></b></div>
  <div class="scene"><div class="card" id="card">
    <div class="face front"><div class="q">?</div>Tap to reveal your card<small>Make sure only you can see the screen</small></div>

<script>

var PAIRS=[["Tea","Coffee"],["Cat","Dog"],["Pizza","Burger"],["Beach","Pool"],["Guitar","Violin"],["Train","Bus"],["Moon","Sun"],["Football","Rugby"],["Sushi","Noodles"],["Apple","Pear"],["Ninja","Samurai"],["Lion","Tiger"],["Movie","Series"],["Pen","Pencil"],["Rain","Snow"],["Castle","Palace"]];

var MODES=[

{id:"emoji",n:"Emoji Only",d:"Describe the word with up to 3 emojis. The imposter only sees the category",o:1},
{id:"last",n:"Last Letter",d:"Imposter knows only the first letter. One word each, and the imposter can guess",o:1},
{id:"uno",n:"UNO",d:"Classic UNO. 2 to 6 players, online only",o:1},
{id:"golf",n:"Golf",d:"3D-style golf, 5 holes. 2 to 6 players, online only. Drag back and release to swing",o:1},
{id:"jenga",n:"Jenga",d:"3D tower with real physics. 2 to 6 players, online only. Slide a block out, it drops on top, don’t topple the tower",o:1}];
var CATS={"Pizza":"Food","Elephant":"Animal","Guitar":"Instrument","Hospital":"Place","Football":"Sport","Airplane":"Transport","Library":"Place","Ocean":"Nature","Birthday":"Event","Doctor":"Job","Volcano":"Nature","Cinema":"Place","Bicycle":"Transport","Snowman":"Winter","Pirate":"Character","Chess":"Game","Coffee":"Drink","Rainbow":"Nature","Astronaut":"Job","Castle":"Place","Ninja":"Character","Sushi":"Food","Camera":"Object","Desert":"Nature","Robot":"Machine","Dragon":"Creature","Lighthouse":"Building","Piano":"Instrument","Tiger":"Animal","Rocket":"Transport","Mountain":"Nature","Samurai":"Character","Fireworks":"Event","School":"Place","Wedding":"Event"};
var RULES={classic:"Describe the word in one sentence each, then vote out the imposter.",blind:"Describe the word in one sentence each. The imposter is totally blind, so listen closely.",double:"Describe the word in one sentence each. Two of you are faking it.",under:"Describe your word in one sentence each. Someone has a different word and doesn’t know it.",quest:"Say your answer out loud, one by one. Someone answered a different question.",chaos:"Describe the word in one sentence each. There might be no imposter at all.",age:"Everyone knows who the age holder is. Ask them questions, then each player guesses their age.",draw:"Take turns adding strokes to the shared drawing, then discuss and vote. Someone doesn’t know the word and is faking it.",emoji:"Chat with up to 3 emojis only. Someone only knows the category, so watch for vague ones.",last:"Say one word that goes with the secret word. The imposter only knows its first letter and gets one guess."};
var rohanI=-1,N=4,mode="classic",players=[],imps=[],pick=null,idx=0,shown=false,ch={};
var $=function(i){return document.getElementById(i)};
var rnd=function(a){return a[Math.floor(Math.random()*a.length)]};
var saved=[];
try{saved=JSON.parse(localStorage.getItem("imp_names")||"[]")}catch(e){}

function buildModes(){
  var m=$("modes");m.innerHTML="";
  MODES.filter(function(o){return !o.o}).forEach(function(o){var b=document.createElement("button");
    b.innerHTML="<b>"+o.n+"</b><span>"+o.d+"</span>";if(o.id===mode)b.className="on";
    b.onclick=function(){mode=o.id;buildModes()};m.appendChild(b)});
}
function buildCount(){
  var c=$("count");c.innerHTML="";
  for(var n=3;n<=6;n++){(function(n){var b=document.createElement("button");b.textContent=n;if(n===N)b.className="on";
    b.onclick=function(){N=n;buildCount();buildNames()};c.appendChild(b)})(n)}
}
function buildNames(){
  var cur=[].map.call(document.querySelectorAll("#names input"),function(i){return i.value});
  var box=$("names");box.innerHTML="";
  for(var i=0;i<N;i++){var inp=document.createElement("input");inp.type="text";inp.placeholder="Player "+(i+1);
    inp.maxLength=14;inp.value=cur[i]||saved[i]||"";box.appendChild(inp)}
}





function show(id){["setup","play","talk","online"].forEach(function(s){$(s).classList.toggle("hide",s!==id)})}

$("start").onclick=function(){
  var ins=document.querySelectorAll("#names input");
  players=[].map.call(ins,function(el,i){return el.value.trim()||("Player "+(i+1))});
  if(mode==="double"&&N<5){$("err").textContent="Double Trouble needs 5 or 6 players.";return}
  $("err").textContent="";
  try{localStorage.setItem("imp_names",JSON.stringify(players))}catch(e){}
  var ri=-1;players.forEach(function(p,i){if(p.toLowerCase()==="rohan"&&ri<0)ri=i});
  rohanI=ri;ch=ri>=0?{spy:true,xray:true}:{};
  var k=mode==="double"?2:mode==="chaos"?rnd([0,1,1,2]):1;
  var pool=players.map(function(_,i){return i}).filter(function(i){return !(ch.never&&i===ri)});
  pool.sort(function(){return Math.random()-.5});
  imps=pool.slice(0,k);
  if(ch.always&&k>0&&imps.indexOf(ri)<0)imps[0]=ri;
  if(mode==="under"){var p=rnd(PAIRS);if(Math.random()<.5)p=[p[1],p[0]];pick={a:p[0],b:p[1]}}
  else if(mode==="quest"){var q=rnd(QUES);pick={a:q[0],b:q[1]}}
  else if(mode==="age"){pick={a:10+Math.floor(Math.random()*51)}}
  else{var w=rnd(WORDS);pick={a:w[0],h:w[1]}}
  idx=0;show("play");render();
};
function card(i){
  var im=imps.indexOf(i)>=0,r=players[i].toLowerCase()==="rohan",c={role:"",big:"",sub:"",imp:im,sm:false,cheat:[]};
  if(mode==="age"){
    var hn=players[imps[0]];
    if(im){c.role="You are the age holder";c.big=pick.a+" years old";c.sub="Answer their questions honestly, but don’t say your age";c.sm=true}
    else{c.role="Guess the age of";c.big=hn;c.sub="Ask them questions to work out their age";c.imp=false}
    if(r&&!im&&ch.xray)c.cheat.push("Age cheat: "+hn+" is "+pick.a+" years old");
  }else if(mode==="under"){
    c.role="Your word is";c.big=im?pick.b:pick.a;c.sub="Describe it without giving it away";c.imp=false;
    if(r&&ch.xray)c.cheat.push("X-ray: crew word = "+pick.a+" | imposter word = "+pick.b);
  }else if(mode==="quest"){
    c.role="Your question";c.big=im?pick.b:pick.a;c.sm=true;c.sub="Answer in 1 to 3 words";c.imp=false;
    if(r&&ch.xray)c.cheat.push("X-ray: crew = "+pick.a+"\nImposter = "+pick.b);
  }else if(!im){
    c.role="The word is";c.big=pick.a;c.sub="Don’t say it out loud";
  }else{
    c.role="You are the imposter";c.big=r?pick.a:"???";
    if(mode==="double")c.sub="Your partner: "+imps.filter(function(x){return x!==i}).map(function(x){return players[x]}).join(", ");
    else if(mode==="draw")c.sub="You don’t know the word. Fake it from what’s drawn.";
    else if(mode==="emoji")c.sub="Category: "+(pick.c||"Thing");
    else if(mode==="last"){c.big=r?pick.a:pick.a.charAt(0).toUpperCase();c.sub="The word starts with this letter"}
    else if(mode!=="blind"||r)c.sub="Hint: "+pick.h;
    else c.sub="No hint. Good luck!";
    if(r&&mode==="double")c.sub+="\nHint: "+pick.h;
  }
  if(r&&ch.spy&&mode!=="age")c.cheat.push("Spy: "+(imps.length?"imposter = "+imps.map(function(x){return players[x]}).join(" & "):"nobody is the imposter"));
  return c;
}
function render(){
  $("pname").textContent=players[idx];
  $("card").classList.remove("flip");
  $("next").classList.add("hide");shown=false;
  $("next").textContent=idx===players.length-1?"Hide & finish":"Hide & pass on";
  var d=$("dots");d.innerHTML="";
  players.forEach(function(_,i){var e=document.createElement("i");if(i<idx)e.className="d";d.appendChild(e)});
}
function swap(){
  var im=imps.indexOf(idx);
  if(im>=0){
    var c=[];for(var j=idx+1;j<players.length;j++)if(imps.indexOf(j)<0)c.push(j);
    if(c.length){imps[im]=rnd(c);return true}
    if(mode==="chaos"){imps.splice(im,1);return true}
    return false;
  }
  var t=imps.filter(function(j){return j>idx});
  if(t.length){imps[imps.indexOf(rnd(t))]=idx;return true}
  if(mode==="chaos"&&imps.length<2){imps.push(idx);return true}
  return false;
}
function paint(){
  var c=card(idx);
  $("back").classList.toggle("imp",c.imp);
  $("role").textContent=c.role;
  $("word").textContent=c.big;$("word").className="word"+(c.sm?" sm":"");
  $("hint").style.whiteSpace="pre-line";$("hint").textContent=c.sub;
  $("cl").textContent=c.cheat.join("\n");$("cl").classList.toggle("hide",!c.cheat.length);
  var cm=$("cm");cm.innerHTML="";cm.classList.toggle("hide",idx!==rohanI);
  if(idx===rohanI){
    var b=document.createElement("button");b.textContent=imps.indexOf(idx)>=0?(mode==="age"?"Make me guesser":"Make me crew"):(mode==="age"?"Make me age holder":"Make me imposter");
    b.onclick=function(e){e.stopPropagation();var ok=swap();paint();if(!ok){var s=document.createElement("span");s.textContent="Too late, others already saw their cards";$("cm").appendChild(s)}};
    cm.appendChild(b);
  }
}
$("card").onclick=function(){
  if(shown)return;shown=true;paint();
  $("card").classList.add("flip");
  setTimeout(function(){$("next").classList.remove("hide")},500);
};
$("next").onclick=function(){
  $("card").classList.remove("flip");$("next").classList.add("hide");
  setTimeout(function(){
    idx++;
    if(idx>=players.length){
      var m=MODES.filter(function(o){return o.id===mode})[0];
      $("mname").textContent=m.n+" mode";$("rule").textContent=RULES[mode];$("show").textContent=mode==="age"?"Reveal age":"Reveal imposter";
      $("first").textContent=rnd(players);
      $("reveal").classList.add("hide");$("show").classList.remove("hide");
      $("tip").innerHTML=rohanI>=0?tipHtml(imps.indexOf(rohanI)>=0,imps.length>0,pick,mode):"";show("talk");
    }else render();
  },350);
};
$("show").onclick=function(){
  $("rl").textContent=mode==="age"?"The age holder was":imps.length>1?"The imposters were":"The imposter was";
  $("impname").textContent=imps.length?imps.map(function(x){return players[x]}).join(" & "):"Nobody!";
  $("info").textContent=mode==="under"?"Crew word: "+pick.a+" | Imposter word: "+pick.b
    :mode==="quest"?"Crew: "+pick.a+" | Imposter: "+pick.b
    :mode==="age"?"Their age was "+pick.a:"The word was "+pick.a;
  $("reveal").classList.remove("hide");$("show").classList.add("hide");
};
$("again").onclick=function(){show("setup");buildNames()};
buildModes();buildCount();buildNames();
</script>
<script>

function tipData(isImp,anyImp,pk,md){
  if(!pk||md==="age"||md==="draw")return null;

    if(can)h+='<div class="chips">'+[d.best,d.alt].filter(Boolean).map(chip).join("")+'</div>'+(ONL[r.mode]?'':'<div class="kl" style="margin-top:12px">Natural lines</div><div class="chips" style="justify-content:flex-start;margin-top:0">'+(isI?LINES.imp:LINES.crew).map(chip).join("")+'</div>')+'<div class="kn">Taps send after a random 1 to 3 second delay.</div>';
    h+='</div>';
  }
  h+='<div class="ks"><div class="kl">Who is who</div>'+us.map(function(u){var p=r.players[u],x=im.indexOf(u)>=0;return'<div class="kr"><span'+(p.alive===false?' class="dim"':'')+'>'+esc(p.name)+(p.alive===false?' · out':'')+'</span><em class="bd '+(x?'bi':'bc')+'">'+(x?'imposter':'crew')+'</em></div>'}).join("")+'<div class="kn">'+esc(info(r))+'</div></div>';
  var cnt={};al.forEach(function(u){var t=v[u];if(t)cnt[t]=(cnt[t]||0)+1});

function mkIcon(sz,mask){
  var c=document.createElement("canvas");c.width=c.height=sz;var x=c.getContext("2d");

  x.fillStyle="#6d4aff";
  if(mask)x.fillRect(0,0,sz,sz);
  else{var r=b*.26;x.beginPath();x.moveTo(o+r,o);x.arcTo(o+b,o,o+b,o+b,r);x.arcTo(o+b,o+b,o,o+b,r);x.arcTo(o,o+b,o,o,r);x.arcTo(o,o,o+b,o,r);x.closePath();x.fill()}

  x.fillStyle="#ff4a6e";x.beginPath();x.arc(o+.663*b,o+.727*b,.055*b,0,6.2832);x.fill();
  return c.toDataURL("image/png");
}
